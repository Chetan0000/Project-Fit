<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitForge UI demo 3: Framed sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" /><!-- taste-skill-ignore: IBM Plex Mono has one job here, ISO dates (app-screens §13) -->
<style>
/* ─────────────────────────────────────────────────────────────────────────
   FitForge UI demo 3. Direction: "Framed sheet" (seed 1021611558), light.
   Move: one tinted frame (status bar + 48px top bar, no rule between them);
   the work sits on a white sheet with a hairline edge and 16px corners, no
   shadow. The active tab is a 2px underline in ink; the rest of the chrome
   is grey. On a phone the frame folds to the top bar and the sheet is the screen.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --ground:#f9fbfc; --device:#eef1f3; --surface:#ffffff; --raised:#f4f6f8; --active:#ebedee;
  --border:#e8eaec; --rule:#f0f1f2; --control:#cdced1;
  --text:#131416; --muted:#5d5f60; --faint:#6b6b6b;
  --accent:#1b6c80; --positive:#1e7b4f; --negative:#c4242a; --warning:#92400e;
  --primary:#131416; --primary-ink:#ffffff;
  --grid:#e5e5e5;
  --font:"IBM Plex Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; /* taste-skill-ignore: mono has one job here, ISO dates (app-screens §13) */
  --radius-card:8px; --radius-control:6px; --radius-sheet:16px;
  --phone-w:390px; --phone-h:844px;
  --gap:14px; --pad:16px;
  --fs-title:22px; --fs-section:16px; --fs-kpi:28px; --fs-body:14px; --fs-small:12px;
  --ease-out:cubic-bezier(.22,1,.36,1); --t-press:120ms; --t-hover:150ms;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:var(--fs-body)/21px var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.date{font-family:var(--mono);font-size:11px} /* taste-skill-ignore: mono for ISO dates, the one job */

/* board */
.board{max-width:1360px;margin:0 auto;padding:28px 24px 80px}
.board > header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.board h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.board .sub{color:var(--muted);margin-top:6px;max-width:62ch}
.brandline{display:flex;align-items:center;gap:10px}
.mark{width:20px;height:20px;color:var(--accent);flex:none}
.tagline{color:var(--muted);font-size:var(--fs-small);padding:6px 0}
.gallery{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px;align-items:flex-start;justify-content:center}
figure.phone{width:var(--phone-w);max-width:100%;min-width:0}
.device{background:var(--device);border:1px solid var(--border);border-radius:32px;padding:10px;max-width:100%;overflow:hidden}
.screen{position:relative;height:var(--phone-h);background:var(--ground);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
figcaption{margin-top:10px;padding-left:6px;color:var(--muted);font-size:var(--fs-small)}
figcaption b{color:var(--text);font-weight:500}
@media (max-width:900px){
  figure.phone{flex:1 1 100%;width:100%;min-width:0}
  .screen{height:auto;min-height:640px}
}

/* chrome: status bar + 48px top bar share the tint, no rule between them */
.statusbar{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 20px;font-size:12px;font-weight:500;flex:none;background:var(--ground)}
.statusbar .osmarks{display:flex;align-items:center;color:var(--muted)}
.sig{display:block;width:16px;height:10px;border:1.2px solid currentColor;border-radius:2.5px;position:relative}
.sig::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:8px;background:currentColor;border-radius:1px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 16px;flex:none;background:var(--ground)}
.topbar .screenname{font-weight:600}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-control);color:var(--muted)}
.iconbtn:hover{background:var(--active);color:var(--text)}

/* the sheet: white, 1px edge, 16px corners, flat */
.sheet{flex:1;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sheet);margin:0 8px 8px;display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;min-height:0;padding:18px var(--pad) 16px;overflow:hidden;display:flex;flex-direction:column;gap:var(--gap)}
.body.center{justify-content:center;gap:20px;padding-bottom:30px}

/* type */
.screen-title{font-size:var(--fs-title);line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted)}
.meta{color:var(--faint);font-size:var(--fs-small)}
.label{color:var(--muted);font-size:var(--fs-small)}
.lead{color:var(--muted);font-size:14px;line-height:22px}

/* controls: 6px, one primary in near-black */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--control);background:var(--surface);font-weight:500;transition:background-color var(--t-hover) ease}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.92}
.btn.block{width:100%;height:44px}
.btn.sm{height:30px;padding:0 12px}
.field{display:grid;gap:7px}
.field label{font-weight:500}
.field .hint{color:var(--muted);font-size:var(--fs-small)}
.input{height:40px;padding:0 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);width:100%}
.input::placeholder{color:var(--faint)}

/* cards: 1px #e8eaec edge on the sheet, radius 8, flat */
.panel,.rows,.kpis,.set,.stepper,.split{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card)}
.panel{padding:14px}
.rows{display:grid;overflow:hidden}
.rows .row{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px}
.rows .row + .row{border-top:1px solid var(--rule)}
.row .grow{flex:1;min-width:0}
.row .rname{font-weight:500}
.row .rsub{color:var(--muted);font-size:13px;margin-top:2px}
.row .rval{font-weight:500}
.done{color:var(--accent)}
.tick{width:15px;height:15px;flex:none;color:var(--accent)}

/* KPI strip: label semibold, value 28 at 400 */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.kpi{padding:14px 16px;min-width:0}
.kpi + .kpi{border-left:1px solid var(--border)}
.kpi-label{color:var(--muted);font-size:var(--fs-small);font-weight:600}
.kpi-value{margin-top:4px;font-size:var(--fs-kpi);line-height:1.1;font-weight:400;letter-spacing:-.015em}
.kpi-value small{font-size:.46em;color:var(--muted);font-weight:400}
.neg{color:var(--negative)}

/* cycle strip */
.cycle{display:flex;flex-wrap:wrap;gap:8px}
.cycle .day{padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--raised);color:var(--muted);font-size:13px;font-weight:500}
.cycle .day.rest{color:var(--faint)}
.cycle .day.today{background:var(--surface);border-color:var(--accent);color:var(--text)}

/* split builder */
.splits{display:grid;gap:8px}
.split{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 13px;background:var(--surface)}
.split .n{flex:1;min-width:0}
.split .n b{font-weight:500;display:block}
.split .n span{color:var(--muted);font-size:13px}
.split .tag{color:var(--muted);font-size:13px}
.grip{color:var(--faint);flex:none;letter-spacing:-2px;font-size:13px;line-height:1}

/* progress */
.progress{display:grid;gap:7px}
.progress .track{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.progress .fill{height:100%;background:var(--accent)}
.progress .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-small)}

/* sets */
.sets{display:grid;gap:8px}
.set{display:flex;align-items:center;gap:12px;padding:10px 13px}
.set .idx{color:var(--faint);width:16px;font-size:var(--fs-small)}
.set .fig{flex:1;font-weight:500}
.set .fig small{color:var(--muted);font-weight:400}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{padding:9px 12px;display:grid;gap:7px}
.stepper .rowline{display:flex;align-items:center;justify-content:space-between}
.stepper .val{font-size:18px;font-weight:600}
.iconbtn.sq{width:28px;height:28px;border-radius:var(--radius-control);background:var(--raised);color:var(--text)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--faint);font-size:11px}
.chart .bar{fill:var(--accent)}
.chart .baseline{stroke:var(--control);stroke-width:1}

/* tabs: 2px underline in ink; the rest of the chrome is grey */
.tabbar{display:flex;height:58px;flex:none;border-top:1px solid var(--border);padding:0 6px}
.tabbar a{flex:1;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);font-size:13px;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--text);font-weight:600}
.tabbar a[aria-current="page"]::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2px;background:var(--text)}

.avatar{width:40px;height:40px;border-radius:999px;background:var(--raised);display:grid;place-items:center;font-weight:600;flex:none}
.previewrow{display:flex;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="board">
  <header>
    <div>
      <div class="brandline">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5M7.5 6.5v11M16.5 6.5v11M20 9.5v5M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <h1>FitForge</h1>
      </div>
      <p class="sub">Third direction. The chrome is one tinted frame and the work sits on a white sheet with a hairline edge and no shadow: depth from a single tone step, with the brand shrinking to the mark and a 2px tab underline.</p>
    </div>
    <span class="tagline">seed 1021611558 · light · IBM Plex Sans (+ Plex Mono for dates)</span>
  </header>

  <div class="gallery">

    <!-- 1 Welcome -->
    <figure class="phone">
      <div class="device"><div class="screen">
        <div class="statusbar"><span class="num">9:41</span><span class="osmarks"><span class="sig"></span></span></div>
        <div class="sheet"><div class="body center">
          <svg class="mark" style="width:30px;height:30px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5M7.5 6.5v11M16.5 6.5v11M20 9.5v5M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <h2 class="screen-title">Track the cycle,<br />not the week</h2>
          <p class="lead">FitForge runs your Push / Pull / Legs split as a rolling cycle. Miss a day and the plan shifts with you, no resetting to Monday.</p>
          <div class="cycle" aria-label="Cycle preview">
            <span class="day">Push A</span><span class="day">Pull A</span><span class="day">Legs A</span>
            <span class="day rest">Rest</span><span class="day">Push B</span><span class="day">Pull B</span>
            <span class="day">Legs B</span><span class="day rest">Rest</span>
          </div>
          <div style="display:grid;gap:10px;margin-top:2px">
            <button class="btn primary block">Start training</button>
            <button class="btn block">I already have an account</button>
          </div>
        </div></div>
      </div></div>
      <figcaption><b>Welcome</b>: the cycle, shown before sign-up</figcaption>
    </figure>

    <!-- 2 Username -->
    <figure class="phone">
      <div class="device"><div class="screen">
        <div class="statusbar"><span class="num">9:41</span><span class="osmarks"><span class="sig"></span></span></div>
        <div class="topbar"><button class="iconbtn" aria-label="Menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><span class="screenname">Set up</span><button class="iconbtn" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
        <div class="sheet"><div class="body">
          <div class="progress">
            <div class="track"><div class="fill" style="width:33%"></div></div>
            <div class="ends"><span>Profile</span><span class="num">1 of 3</span></div>
          </div>
          <h2 class="screen-title" style="margin-top:2px">What should we call you?</h2>
          <p class="sub">This is the name on your profile. You can change it later.</p>
          <div class="field">
            <label for="un3">Username</label>
            <input id="un3" class="input" value="chetan" autocomplete="off" />
            <p class="hint">Letters, numbers and underscores. 2–20 characters.</p>
          </div>
          <div class="panel" style="display:grid;gap:10px">
            <p class="label">Preview</p>
            <div class="previewrow">
              <span class="avatar">C</span>
              <span><b style="font-weight:500">chetan</b><span class="meta" style="display:block">Member since 21 Oct 2026</span></span>
            </div>
          </div>
          <div style="margin-top:auto"><button class="btn primary block">Continue</button></div>
        </div></div>
      </div></div>
      <figcaption><b>Username</b>: a real progress ratio, not dots</figcaption>
    </figure>

    <!-- 3 Split builder -->
    <figure class="phone">
      <div class="device"><div class="screen">
        <div class="statusbar"><span class="num">9:41</span><span class="osmarks"><span class="sig"></span></span></div>
        <div class="topbar"><button class="iconbtn" aria-label="Menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><span class="screenname">Your split</span><button class="iconbtn" aria-label="Options">&#8943;</button></div>
        <div class="sheet"><div class="body">
          <p class="sub">8 days on a rolling loop. Drag to reorder; rest days sit wherever you put them.</p>
          <ol class="splits">
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Push A</b><span>Bench, OHP, Incline, Lateral, Pushdown</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Pull A</b><span>Deadlift, Row, Pulldown, Curl, Face pull</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Legs A</b><span>Squat, RDL, Leg press, Calf, Hanging raise</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Rest</b><span>No session</span></span><span class="tag num">0</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Push B</b><span>Incline bench, DB press, Fly, Lateral, Dips</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Pull B</b><span>Pull-up, Row, Shrug, Curl, Rear delt</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Legs B</b><span>Front squat, Hip thrust, Curl, Calf, Plank</span></span><span class="tag num">5</span></li>
            <li class="split"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="n"><b>Rest</b><span>No session</span></span><span class="tag num">0</span></li>
          </ol>
          <div style="margin-top:auto"><button class="btn primary block">Save split</button></div>
        </div></div>
      </div></div>
      <figcaption><b>Split Builder</b>: the rolling cycle, reorderable</figcaption>
    </figure>

    <!-- 4 Today -->
    <figure class="phone">
      <div class="device"><div class="screen">
        <div class="statusbar"><span class="num">9:41</span><span class="osmarks"><span class="sig"></span></span></div>
        <div class="topbar">
          <span class="name" style="display:flex;align-items:center;gap:9px;font-weight:600"><svg class="mark" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5M7.5 6.5v11M16.5 6.5v11M20 9.5v5M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>FitForge</span>
          <button class="iconbtn" aria-label="Options">&#8943;</button>
        </div>
        <div class="sheet">
          <div class="body">
            <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
              <div><h2 class="screen-title">Push A</h2><p class="sub">Today · session 3 of 8 in the cycle</p></div>
              <button class="btn primary sm">Start</button>
            </div>
            <div class="cycle" aria-label="Cycle position">
              <span class="day">Push A</span><span class="day">Pull A</span><span class="day today">Legs A</span>
              <span class="day rest">Rest</span><span class="day">Push B</span><span class="day">Pull B</span>
              <span class="day">Legs B</span><span class="day rest">Rest</span>
            </div>
            <div class="kpis">
              <div class="kpi"><p class="kpi-label">Sets logged</p><p class="kpi-value num">8<small>/16</small></p></div>
              <div class="kpi"><p class="kpi-label">Volume today</p><p class="kpi-value num">3,190<small>kg</small></p></div>
              <div class="kpi"><p class="kpi-label">Streak</p><p class="kpi-value num">9<small>sessions</small></p></div>
            </div>
            <div class="rows">
              <div class="row"><span class="grow"><span class="rname">Bench Press</span><span class="rsub num">4 × 6–8 · 70.0 kg</span></span><span class="rval num done">4/4</span></div>
              <div class="row"><span class="grow"><span class="rname">Overhead Press</span><span class="rsub num">3 × 8 · 40.0 kg</span></span><span class="rval num done">3/3</span></div>
              <div class="row"><span class="grow"><span class="rname">Incline DB Press</span><span class="rsub num">3 × 10 · 24.0 kg</span></span><span class="rval num">1/3</span></div>
              <div class="row"><span class="grow"><span class="rname">Lateral Raise</span><span class="rsub num">3 × 15 · 10.0 kg</span></span><span class="rval num meta" style="font-weight:400">0/3</span></div>
              <div class="row"><span class="grow"><span class="rname">Triceps Pushdown</span><span class="rsub num">3 × 12 · 25.0 kg</span></span><span class="rval num meta" style="font-weight:400">0/3</span></div>
            </div>
          </div>
          <nav class="tabbar">
            <a href="#" aria-current="page">Today</a><a href="#">Split</a><a href="#">Progress</a><a href="#">Profile</a>
          </nav>
        </div>
      </div></div>
      <figcaption><b>Today</b>: what's next and how much is left</figcaption>
    </figure>

    <!-- 5 Active workout -->
    <figure class="phone">
      <div class="device"><div class="screen">
        <div class="statusbar"><span class="num">9:41</span><span class="osmarks"><span class="sig"></span></span></div>
        <div class="topbar"><button class="iconbtn" aria-label="Back">&#8592;</button><span class="screenname">Bench Press</span><span class="meta num" style="font-weight:500">00:42</span></div>
        <div class="sheet"><div class="body">
          <p class="meta num">Exercise 1 of 5 · target 4 × 6–8 · 70.0 kg</p>
          <div class="sets">
            <div class="set"><span class="idx num">1</span><span class="fig num">70.0 kg <small>× 8</small></span><svg class="tick" viewBox="0 0 16 16" aria-label="Done"><path d="M3 8.5l3.2 3.2L13 4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="set"><span class="idx num">2</span><span class="fig num">70.0 kg <small>× 8</small></span><svg class="tick" viewBox="0 0 16 16" aria-label="Done"><path d="M3 8.5l3.2 3.2L13 4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="set"><span class="idx num">3</span><span class="fig num">70.0 kg <small>× 7</small></span><svg class="tick" viewBox="0 0 16 16" aria-label="Done"><path d="M3 8.5l3.2 3.2L13 4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="set"><span class="idx num">4</span><span class="fig num">70.0 kg <small>× 6</small></span><svg class="tick" viewBox="0 0 16 16" aria-label="Done"><path d="M3 8.5l3.2 3.2L13 4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <div class="steppers">
            <div class="stepper"><span class="label">Weight</span><span class="rowline"><button class="iconbtn sq" aria-label="Less weight">&#8722;</button><span class="val num">70.0</span><button class="iconbtn sq" aria-label="More weight">+</button></span></div>
            <div class="stepper"><span class="label">Reps</span><span class="rowline"><button class="iconbtn sq" aria-label="Fewer reps">&#8722;</button><span class="val num">8</span><button class="iconbtn sq" aria-label="More reps">+</button></span></div>
